services:
  latexedit:
    build:
      context: .
      dockerfile: Dockerfile
    image: latexedit:local
    container_name: latexedit
    restart: unless-stopped
    ports:
      # HTTPS na porta pública 8095 (Abrir pasta exige secure context)
      - "8095:8443"
      # HTTP opcional interno/debug na 8096
      - "8096:8080"
    environment:
      LATEX_ENGINE: pdflatex
      LATEX_TIMEOUTSECONDS: "120"
      LATEX_PASSES: "2"
      TLS_SAN_EXTRA: "IP:192.168.0.3"
      TZ: America/Sao_Paulo
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
