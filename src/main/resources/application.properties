# LaTeX Edit — backend
app.name=LaTeX Edit
app.version=1.0.0

# Compilador: pdflatex | xelatex | lualatex | latexmk
latex.engine=pdflatex
# Opcional: caminho absoluto do pdflatex.exe ou da pasta bin do MiKTeX/TeX Live
latex.enginePath=
latex.timeoutSeconds=120
latex.maxFiles=200
latex.maxFileBytes=5242880
latex.passes=2
# Pasta de projetos no servidor (Docker: /data/workspace)
latex.workspaceRoot=./workspace
