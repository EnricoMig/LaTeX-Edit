# LaTeX IDE — backend
app.name=LaTeX IDE
app.version=1.0.0

# Compilador: pdflatex | xelatex | lualatex | latexmk
latex.engine=pdflatex
# Opcional: pasta/binário do TeX. Vazio = PATH / descoberta automática (TinyTeX, TeX Live).
# Override: LATEX_ENGINEPATH
latex.enginePath=
latex.timeoutSeconds=120
latex.maxFiles=200
latex.maxFileBytes=5242880
latex.passes=2
# Pasta de projetos no servidor.
# Absoluto (Docker): /data/workspace via LATEX_WORKSPACEROOT
# Relativo: resolve em catalina.base (Tomcat) ou ~/Documentos/LaTeX/
latex.workspaceRoot=latex-workspace
